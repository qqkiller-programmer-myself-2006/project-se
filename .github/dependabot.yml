version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Major upgrades (express 5, zod 4, react 19, vite 8 ...) ต้องทำทีละตัวด้วยมือ
    # พร้อมแก้โค้ดให้ผ่าน typecheck/test — ไม่ให้ Dependabot รวมเป็น PR เดียว
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
